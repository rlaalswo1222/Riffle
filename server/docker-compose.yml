services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-barlink}
      POSTGRES_USER: ${DB_USER:-barlink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barlink}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../barlink_ddl.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-barlink}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-barlink}
      DB_USER: ${DB_USER:-barlink}
      DB_PASSWORD: ${DB_PASSWORD:-barlink}
      REDIS_HOST: redis
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
